version: 2
updates:
  # npm packages in desktop/electron
  - package-ecosystem: "npm"
    directory: "/desktop/electron"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"

  # pip packages in gateway
  - package-ecosystem: "pip"
    directory: "/gateway"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
