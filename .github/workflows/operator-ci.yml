name: Victor Operator CI

on:
  push:
    branches: [main, develop, "agent/**"]
    paths: ["operator/**", ".github/workflows/operator-ci.yml"]
  pull_request:
    paths: ["operator/**", ".github/workflows/operator-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: operator/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check victor_operator tests
      - run: pytest -q
