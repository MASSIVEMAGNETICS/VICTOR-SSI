name: CI (component capability matrix)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: write  # required for GitHub Actions cache (cache-to: type=gha)

jobs:
  validate-component:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            mode: docker
            context: ./gateway
          - service: ragflow
            mode: docker
            context: ./ragflow
            checkout_repo: MASSIVEMAGNETICS/ragflow
            checkout_path: ragflow
            checkout_ref: fix/sync-upstream-2026-08-14
          - service: conscious-river
            mode: python-tests
            context: ./conscious-river
            checkout_repo: MASSIVEMAGNETICS/conscious-river
            checkout_path: conscious-river
            checkout_ref: main
            python_version: "3.11"
          - service: research-agent
            mode: python-syntax
            context: ./Liquidation-Analysis-using-Multi-Agent-Reinforcement-Learning-ICML-2019
            checkout_repo: MASSIVEMAGNETICS/Liquidation-Analysis-using-Multi-Agent-Reinforcement-Learning-ICML-2019
            checkout_path: Liquidation-Analysis-using-Multi-Agent-Reinforcement-Learning-ICML-2019
            checkout_ref: master
            python_version: "3.11"

    steps:
      - name: Checkout orchestration repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout component repo
        if: matrix.checkout_repo != null
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.checkout_repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ matrix.checkout_path }}
          ref: ${{ matrix.checkout_ref }}

      - name: Verify declared component contract
        shell: bash
        run: |
          set -euo pipefail
          echo "service=${{ matrix.service }}"
          echo "mode=${{ matrix.mode }}"
          echo "context=${{ matrix.context }}"
          test -d "${{ matrix.context }}" || {
            echo "ERROR: declared context '${{ matrix.context }}' does not exist"
            exit 1
          }
          case "${{ matrix.mode }}" in
            docker)
              test -f "${{ matrix.context }}/Dockerfile" || {
                echo "ERROR: docker-mode component has no Dockerfile: ${{ matrix.context }}/Dockerfile"
                exit 1
              }
              ;;
            python-tests)
              test -f "${{ matrix.context }}/requirements.txt" || {
                echo "ERROR: python-tests component has no requirements.txt"
                exit 1
              }
              find "${{ matrix.context }}" -maxdepth 1 -type f -name 'test_*.py' -print -quit | grep -q . || {
                echo "ERROR: python-tests component has no root test_*.py files"
                exit 1
              }
              ;;
            python-syntax)
              find "${{ matrix.context }}" -maxdepth 1 -type f -name '*.py' -print -quit | grep -q . || {
                echo "ERROR: python-syntax component has no Python source files"
                exit 1
              }
              ;;
            *)
              echo "ERROR: unsupported validation mode '${{ matrix.mode }}'"
              exit 1
              ;;
          esac

      - name: Set up QEMU
        if: matrix.mode == 'docker'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: matrix.mode == 'docker'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (load into daemon, no push)
        if: matrix.mode == 'docker'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: massive/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Run gateway unit tests inside built image
        if: matrix.service == 'gateway' && matrix.mode == 'docker'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gateway/requirements.txt ]; then
            docker run --rm massive/gateway:ci \
              /bin/bash -lc "python -m pip install pytest -q && pytest -q"
          else
            echo "ERROR: gateway/requirements.txt is missing"
            exit 1
          fi

      - name: Set up Python for testable Python component
        if: matrix.mode == 'python-tests'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: ${{ matrix.context }}/requirements.txt

      - name: Run Conscious River tests
        if: matrix.mode == 'python-tests'
        working-directory: ${{ matrix.context }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Set up Python for legacy syntax gate
        if: matrix.mode == 'python-syntax'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Compile legacy research-agent Python sources
        if: matrix.mode == 'python-syntax'
        working-directory: ${{ matrix.context }}
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          echo "Syntax gate passed. Runtime compatibility is not claimed: upstream README pins Python 3.7 / TensorFlow 1.8."
