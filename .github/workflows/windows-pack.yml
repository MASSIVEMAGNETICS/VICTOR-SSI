name: Build Windows Electron App

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-windows-app:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/electron/package-lock.json

      - name: Install dependencies
        working-directory: desktop/electron
        run: npm ci

      - name: Build Windows distributable
        working-directory: desktop/electron
        run: npm run dist

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: victor-ssi-windows-installer
          path: desktop/electron/dist/*.exe
          if-no-files-found: warn
          retention-days: 30
